<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitMe">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>FitMe</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
main{max-width:520px;margin:auto;padding:28px 18px 42px}
h1{font-size:38px;letter-spacing:-2px;margin:4px 0}.sub{color:#6b6b70;margin:0 0 24px}
.card{background:#fff;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.step{font-size:13px;font-weight:800;text-transform:uppercase;color:#777;letter-spacing:.7px;margin-bottom:9px}
.upload{border:1.5px dashed #c7c7cc;border-radius:18px;padding:22px;text-align:center;font-weight:700;display:block;cursor:pointer}
input{display:none}.preview{display:none;width:100%;max-height:390px;object-fit:cover;border-radius:16px;margin-top:12px}
button{width:100%;border:0;border-radius:17px;padding:17px;background:#111;color:#fff;font-size:17px;font-weight:800}
button:disabled{opacity:.35}.result{display:none;position:relative;overflow:hidden;border-radius:18px;background:#eee}
.result #personOut{width:100%;display:block}.overlay{position:absolute;left:18%;top:18%;width:64%;opacity:.78;mix-blend-mode:multiply;display:none}
.small{font-size:13px;color:#777;line-height:1.45}.status{margin:10px 0 0;font-weight:600}
</style>
</head>
<body>
<main>
<h1>FitMe</h1>
<p class="sub">Essaie virtuellement tes vêtements avant de les acheter.</p>

<section class="card">
<div class="step">Étape 1</div>
<label class="upload">📸 Ajouter une photo de toi
<input id="person" type="file" accept="image/*"></label>
<img id="personPrev" class="preview" alt="Ta photo">
</section>

<section class="card">
<div class="step">Étape 2</div>
<label class="upload">👕 Ajouter le vêtement
<input id="garment" type="file" accept="image/*"></label>
<img id="garmentPrev" class="preview" alt="Le vêtement">
</section>

<button id="try" disabled>✨ Essayer sur moi</button>

<section class="card">
<div class="step">Aperçu</div>
<div id="result" class="result">
<img id="personOut" alt="Aperçu sur toi">
<img id="overlay" class="overlay" alt="">
</div>
<p id="status" class="status">Ajoute les deux photos.</p>
<p class="small">Cette version est prête pour l'écran d'accueil iPhone. Le moteur IA photoréaliste peut ensuite être branché pour ajuster automatiquement le vêtement à ta morphologie.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let p="",g="";
function pick(id,prev,cb){
  $(id).addEventListener("change",e=>{
    const f=e.target.files?.[0]; if(!f)return;
    const u=URL.createObjectURL(f); cb(u); $(prev).src=u; $(prev).style.display="block";
    $("try").disabled=!(p&&g); $("status").textContent=p&&g?"Les deux photos sont prêtes.":"Il manque une photo.";
  });
}
pick("person","personPrev",u=>p=u); pick("garment","garmentPrev",u=>g=u);
$("try").onclick=()=>{
  $("personOut").src=p; $("overlay").src=g; $("overlay").style.display="block";
  $("result").style.display="block"; $("status").textContent="Aperçu généré.";
  $("result").scrollIntoView({behavior:"smooth",block:"center"});
};
</script>
</body></html>
